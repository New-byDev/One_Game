<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <title>ZombixUP</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #121212;
                color: white;
                font-family: Arial, sans-serif;
                overflow-x: hidden;
                width: 100%;
            }
            .top-panel {
                display: flex;
                align-items: center;
                background: #1b1b1b;
                padding: 10px 20px;
                position: relative;
            }
            .menu-button {
                height: 30px;
                width: 30px;
                background: #2e2e2e;
                margin-left: auto;
                border: none;
                color: white;
                font-size: 12px;
                border-radius: 5px;
            }
            .menu-button:hover {
                background: #242424;
            }
            .dropdown {
                display: flex;
                gap: 10px;
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                background: #242424;
                box-sizing: border-box;
                margin: 0;

                max-height: 0px;
                padding: 0 10px;
                overflow: hidden;

                transition: max-height 0.3s ease, padding 0.3s ease;
            }
            .dropdown.open {
                max-height: 100px;
                padding: 10px;

            }
            .dropdown a {
                flex: 1;
                text-align:center;
                display: block;
                padding: 10px;
                color: white;
                text-decoration: none;
                border-radius: 5px;
            }

            .dropdown a:hover {
                background: #1b1b1b;
            }
            .dropdown a.active-link {
                background: #383838;
                color: #65db83;
            }

            .content {
                padding: 15px;
            }

            .window {
                display: none;
            }

            .window.active {
                display: block;
                animation: windowShow 0.25s ease;
            }
            @keyframes windowShow {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .header-info h2 {
                margin: 0;
                font-size: 21px;
            }
            .header-info p {
                margin:4px 0 0 ;
                color: #929191;
                font-size: 13px;
            }
            .avatar-frame {
                width: 110px;
                height: 110px;
                padding: 4px;
                border-radius: 50%;

                background: linear-gradient(
                    50deg,
                    #ff0000,
                    #000000,
                    #646464
                );
                box-sizing: border-box;
            }
            .avatar-frame img {
                width: 100%;
                height: 100%;

                border-radius: 50%;
                object-fit: cover;
                box-sizing: border-box;
                background: #242424;
                border:4px solid #121212;
            }
            .balance-box {
                display: flex;
                align-items: baseline;
            }
            .profile-card {
                display: flex;
                align-items:flex-start ;
                gap: 15px;
                background: #1b1b1b;
                padding: 20px;
                border-radius: 20px;
            }
            .info-prof {
                line-height: 0.2;
            }
            .admp {
                display: none;
                align-items: center !important;
                justify-content: center !important;
                text-decoration: none;
                width: 150px;
                height: 50px;
                color: white;
                border-radius: 10px;
                background: #222222;
                margin: 0;
                
                
            }
            .admp:hover {
                background: #1b1b1b;
            }
            
        </style>

    
        
    </head>

    <body>
        <header class="top-panel">
            <div class="header-info">
                <h2>ZombixUP</h2>
                <p id="current-tab">Главная</p>
            </div>
            <button class="menu-button" onclick="toggleMenu()">☰</button>
            
        </header>
        <div class="dropdown" id="dropdown">
                <a href="#" data-window="home" class="active-link">Главная</a>
                <a href="#" data-window="games">Игры</a>
                <a href="#" data-window="setting">Настройки</a>
                <a href="#" data-window="profile">Профиль</a>
                
            </div>
        <main class="content">
            <section class="window active" id="home">
                <p>Основной контент</p>
                <p id="telegram-status">Проверяем Telegram...</p>
            </section>

            <section class="window" id="games">
                <p>Здесь игры :D</p>
            </section>
            <section class="window" id="profile">
                
                <div class="profile-card">

                    <div class="avatar-frame">
                        <img id="telegram-avatar" src="" alt="">
                    </div>
                    <div class="info-prof">
                        <p class="idp">ID: <span id="telegram-id">—</span></p>
                    
                        <p class="name">Имя: <span id="telegram-name">—</span></p>
                        <p class="usern">Username: <span id="telegram-username">—</span></p>
                    
                        <div class="balance-box">
                            <p class="baln">Ваш баланс: </p>
                            <p id="balance">Загрузка...</p>
                        </div>
                    </div>
                </div>
                <a class="admp" href="#" data-window="admin" id="admin-menu-item" hidden>
                    Админ-панель
                </a>
            </section>

            <section class="window" id="setting">
                <p>Тута настройки</p>
            </section>
            <section class="window" id="admin">
                <h2>Админ-панель</h2>
                <p>Добро пожаловать, администратор!</p>
            </section>
        </main>
        <script>
            function toggleMenu() {
                let menu = document.getElementById("dropdown");
                menu.classList.toggle("open");

            }
        </script>
    </body>
    <script>
        const menuLinks = document.querySelectorAll(".dropdown a");

            menuLinks.forEach(link => {
                link.addEventListener("click", function(event) {
                    event.preventDefault();

            const windowId = this.dataset.window;
                menuLinks.forEach(link => {
                link.classList.remove("active-link");
            });

            this.classList.add("active-link");
            const tabName = this.textContent;
                document.getElementById("current-tab").textContent = tabName;

                document.querySelectorAll(".window").forEach(window => {
                    window.classList.remove("active");
                });

                document.getElementById(windowId).classList.add("active");

                document.getElementById("dropdown").classList.remove("open");
            });
        });

        
    </script>
    <script>
        const adminMenuItem = document.getElementById("admin-menu-item");

            adminMenuItem.addEventListener("click", async function(event) {
            event.preventDefault();

        const initData = tg.initData;

        if (!initData) {
            alert("Необходимо открыть сайт через Telegram");
            return;
        }

        try {
            const response = await fetch(API_URL + "/admin-check", {
                method: "GET",
                headers: {
                "Authorization": "tma " + initData
                }
            });

        const result = await response.json();

        if (!response.ok || !result.success) {
            alert("Доступ запрещён");
            return;
        }

        // Скрываем остальные окна
        document.querySelectorAll(".window").forEach(window => {
            window.classList.remove("active");
        });

        // Открываем админ-панель
        document.getElementById("admin").classList.add("active");

        // Меняем название вкладки
        document.getElementById("current-tab").textContent = "Админ-панель";

    } catch (error) {
        console.error(error);
        alert("Ошибка подключения к серверу");
    }
});
    </script>

    
    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();

        const API_URL = "https://zombixup-tg.mirikpirik2009.workers.dev";

        const status = document.getElementById("telegram-status");

        async function checkTelegramAuth() {

            const initData = tg.initData;

            if (!initData) {
                status.textContent = "Тестовый режим";
                return;
            }

            status.textContent = "Проверяем авторизацию...";

            try {
                const response = await fetch(API_URL + "/telegram-test", {
                    method: "GET",
                    headers: {
                        "Authorization": "tma " + initData
                    }
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    status.textContent = "Ошибка авторизации";
                    console.error("Ошибка:", result);
                    return;
                }
                const adminMenuItem = document.getElementById("admin-menu-item");

                adminMenuItem.hidden = result.isAdmin !== true;

                status.textContent = "Telegram подключён!";

                const user = result.user;
                const avatar = document.getElementById("telegram-avatar");

                if (user.photo_url) {
                    avatar.src = user.photo_url;
                } else {
                    avatar.alt = "Фотография профиля недоступна";
                }

                document.getElementById("telegram-id").textContent = user.id;

                document.getElementById("telegram-name").textContent =
                    user.first_name;

                document.getElementById("telegram-username").textContent =
                    user.username ? "@" + user.username : "Не указан";

            } catch (error) {
                status.textContent = "Ошибка подключения к серверу";
                console.error(error);
            }
        }

    checkTelegramAuth();
</script>

</html>
